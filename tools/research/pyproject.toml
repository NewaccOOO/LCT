[project]
name = "heatopt"
version = "0.1.0"
description = "Прототипы алгоритмов трассировки, нижние оценки и бенчмарк для ресёрча routing-research"
requires-python = ">=3.12"
dependencies = [
    "shapely>=2.1",
    "pyproj>=3.7.1",
    "numpy>=2.0",
    "networkx>=3.4",
    "highspy>=1.11",
    "pytest>=8",
    "heatnet-tools",
]

[tool.uv.sources]
heatnet-tools = { path = "..", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["heatopt"]
