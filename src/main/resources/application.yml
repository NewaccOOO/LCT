spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:55432/heatnet}
    username: heatnet
    password: heatnet
  sql:
    init:
      mode: always
  jpa:
    hibernate:
      ddl-auto: none

app:
  data-dir: ${DATA_DIR:data}
  job-workers: ${JOB_WORKERS:2}

management:
  endpoints:
    web:
      exposure:
        include: health

---
spring:
  config:
    activate:
      on-profile: cli
  main:
    web-application-type: none
  boot:
    enableautoconfiguration: false
