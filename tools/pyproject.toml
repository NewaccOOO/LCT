[project]
name = "heatnet-tools"
version = "0.1.0"
description = "Генератор синтетических входов и проверщик выхода трассировки тепловых сетей"
requires-python = ">=3.12"
dependencies = [
    "shapely>=2.1",
    "pyproj>=3.7.1",
    "pytest>=8",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "scipy>=1.18.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["synth/heatsynth", "scenes/heatscenes"]

[dependency-groups]
dev = [
    "pillow>=12.3.0",
]
