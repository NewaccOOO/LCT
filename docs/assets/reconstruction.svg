<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 470" width="1300" height="470" role="img" aria-label="Реконструкция существующей сети"><defs><style>.h{font:600 16px -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;fill:#e2e8f0}.t{font:13px -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;fill:#94a3b8}.s{font:600 12px -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;fill:#e2e8f0}.m{font:12px -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;fill:#94a3b8}</style><filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="1300" height="470"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1300" height="470" rx="18" fill="#0b1220"/><rect x="20" y="20" width="1260" height="430" rx="14" fill="#0f172a" stroke="#1e293b"/><text x="40" y="50" class="h">Реконструкция: добавленный расход идёт к источнику</text><path d="M728.3,267.5 L728.3,126.6" fill="none" stroke="#f43f5e" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/><path d="M728.3,126.6 L493.5,126.6" fill="none" stroke="#f43f5e" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/><path d="M258.7,126.6 L493.5,126.6" fill="none" stroke="#b45309" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><path d="M493.5,126.6 L728.3,126.6" fill="none" stroke="#b45309" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><path d="M728.3,126.6 L994.3,126.6" fill="none" stroke="#b45309" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><path d="M728.3,126.6 L728.3,377.0" fill="none" stroke="#b45309" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><text x="376.1" y="112.6" class="s" text-anchor="middle">DN 400 · хватает</text><text x="610.9" y="112.6" class="s" text-anchor="middle">DN 250 → 300</text><text x="861.3" y="112.6" class="m" text-anchor="middle">DN 200 · не затронут</text><text x="742.3" y="197.0" class="s" text-anchor="start">DN 150 → 200</text><path d="M728.3,267.5 L853.5,267.5 L947.4,392.7" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="1.0" filter="url(#glow)"/><text x="869.1" y="257.5" class="s" text-anchor="start">новая сеть · 40 т/ч</text><text x="681.3" y="164.2" class="s" text-anchor="middle">←</text><text x="556.1" y="164.2" class="s" text-anchor="middle">←</text><text x="430.9" y="164.2" class="s" text-anchor="middle">←</text><text x="714.3" y="311.3" class="s" text-anchor="middle">↑</text><circle cx="258.7" cy="126.6" r="10" fill="#b45309" stroke="#fde68a" stroke-width="2"/><text x="274.7" y="150.6" class="m" text-anchor="start">источник</text><rect x="487.5" y="120.6" width="12" height="12" rx="1.5" fill="#cbd5e1"/><rect x="722.3" y="120.6" width="12" height="12" rx="1.5" fill="#cbd5e1"/><circle cx="728.3" cy="267.5" r="9" fill="none" stroke="#38bdf8" stroke-width="3"/><rect x="724.3" y="263.5" width="8" height="8" rx="1.5" fill="#e0f2fe"/><text x="712.3" y="271.5" class="m" text-anchor="end">врезка в трубу и новая камера</text><circle cx="947.4" cy="392.7" r="6" fill="#f8fafc" stroke="#0b1220" stroke-width="1.5"/><text x="957.4" y="396.7" class="m" text-anchor="start">ОКС</text><text x="243.0" y="361.4" class="m" text-anchor="start">Малиновым части, которым с добавкой 40 т/ч нужен больший диаметр.</text><text x="243.0" y="384.9" class="m" text-anchor="start">Реконструируется только часть от врезки к источнику, по ставке реконструкции, без Kспец.</text></svg>
