version: "3.8"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: heatnet
      POSTGRES_USER: heatnet
      POSTGRES_PASSWORD: heatnet
    ports:
      - "${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # По TCP, а не через сокет: временный сервер initdb слушает только сокет и не должен считаться готовым.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U heatnet -d heatnet"]
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/heatnet
      DATA_DIR: /data
      JOB_WORKERS: "${JOB_WORKERS:-2}"
      JAVA_OPTS: "${JAVA_OPTS:-}"
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - appdata:/data

volumes:
  pgdata:
  appdata:
