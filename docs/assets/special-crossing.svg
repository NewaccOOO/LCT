<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 470" width="1300" height="470" role="img" aria-label="Специальные переходы дороги и газопровода"><defs><style>.h{font:600 16px -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;fill:#e2e8f0}.t{font:13px -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;fill:#94a3b8}.s{font:600 12px -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;fill:#e2e8f0}.m{font:12px -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;fill:#94a3b8}</style><filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="1300" height="470"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1300" height="470" rx="18" fill="#0b1220"/><rect x="20" y="20" width="620" height="430" rx="14" fill="#0f172a" stroke="#1e293b"/><text x="40" y="50" class="h">Дорога: переход под углом ≥ 45°, по 3 м вдоль трассы</text><path d="M90.0,365.0 L90.0,290.2 L570.0,154.3 L570.0,229.2 L90.0,365.0 Z" fill="#1f2937" fill-rule="evenodd" stroke="#475569" stroke-width="1" opacity="1.0"/><path d="M-45.9,366.1 L630.7,174.6" fill="none" stroke="#94a3b8" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="0.6" stroke-dasharray="10 6"/><path d="M266.0,424.0 L386.0,64.0" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="1.0" filter="url(#glow)"/><path d="M302.3,315.3 L337.4,209.9" fill="none" stroke="#fb923c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="1.0" filter="url(#glow)"/><circle cx="302.3" cy="315.3" r="5" fill="#f8fafc" stroke="#0b1220" stroke-width="1.5"/><circle cx="337.4" cy="209.9" r="5" fill="#f8fafc" stroke="#0b1220" stroke-width="1.5"/><text x="98.0" y="80.0" class="s" text-anchor="start">полоса дороги</text><text x="98.0" y="108.0" class="m" text-anchor="start">спецучасток: полигон и по 3 м вдоль трассы за границей</text><text x="410.0"